name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches:
      - main
      - dev
      # Stacked PRs target the previous feature branch, so CI must run for them too.
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "test/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Alpha build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.2 build-tools;36.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew :app:assembleAlphaDebug test -PbuildDate=$(date -u +%Y%m%d) --stacktrace

      - name: Upload alpha debug APK
        uses: actions/upload-artifact@v7
        with:
          name: aram-alpha-debug-apk
          path: app/build/outputs/apk/alpha/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 7
