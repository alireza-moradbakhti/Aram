name: Bug report
description: Report something that behaves incorrectly
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not include personal financial data in screenshots or logs.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Aram version
      description: From Settings → About, or the commit SHA for local builds.
      placeholder: 0.1.0 / commit
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8 · Android 16
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Attach a stack trace or a redacted screenshot if useful.
      render: shell
    validations:
      required: false
