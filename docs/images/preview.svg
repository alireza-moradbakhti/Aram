    <text x="818" y="206" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#8FB5A7">Small steps, kept steady.</text>
    <circle cx="1086" cy="180" r="18" fill="#0E9F6E"/>
    <path d="M1086 172v16M1078 180h16" stroke="#06281E" stroke-width="2.2" stroke-linecap="round"/>

    <!-- goal card 1 -->
    <rect x="818" y="228" width="272" height="196" rx="24" fill="#101C18" stroke="#233D34"/>
    <g transform="translate(872 286)">
      <circle r="34" fill="none" stroke="#1B2F28" stroke-width="9"/>
      <circle r="34" fill="none" stroke="#0E9F6E" stroke-width="9" stroke-linecap="round" stroke-dasharray="145 214" transform="rotate(-90)"/>
      <text y="4" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F3F8F5">68%</text>
    </g>
    <text x="928" y="272" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F3F8F5">Japan trip</text>
    <text x="928" y="292" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8FB5A7">$4,100 of $6,000</text>
    <rect x="928" y="304" width="56" height="20" rx="10" fill="#2C2415"/>
    <text x="956" y="318" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFB95C">🔥 6 wk</text>

    <line x1="842" y1="356" x2="1066" y2="356" stroke="#1B2F28"/>
    <text x="842" y="380" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8FB5A7">Target date</text>
    <text x="842" y="398" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#F3F8F5">March 2027</text>
    <text x="1066" y="380" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8FB5A7">Monthly pace</text>
    <text x="1066" y="398" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6FDDB5">$380 / mo</text>

    <!-- goal card 2 -->
    <rect x="818" y="440" width="272" height="152" rx="24" fill="#101C18" stroke="#233D34"/>
    <g transform="translate(872 486)">
      <circle r="27" fill="none" stroke="#1B2F28" stroke-width="8"/>
      <circle r="27" fill="none" stroke="#FFB95C" stroke-width="8" stroke-linecap="round" stroke-dasharray="76 170" transform="rotate(-90)"/>
      <text y="4" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#F3F8F5">45%</text>
    </g>
    <text x="912" y="474" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F3F8F5">Emergency fund</text>
    <text x="912" y="492" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#8FB5A7">$2,700 of $6,000</text>
    <rect x="912" y="504" width="66" height="20" rx="10" fill="#2C2415"/>
    <text x="945" y="518" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" font-weight="600" fill="#FFB95C">🔥 3 wk</text>
    <line x1="842" y1="540" x2="1066" y2="540" stroke="#1B2F28"/>
    <text x="842" y="564" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10" fill="#8FB5A7">No deadline · keep going</text>

    <!-- add money -->
    <rect x="818" y="610" width="272" height="48" rx="24" fill="#0E9F6E"/>
    <text x="954" y="640" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">Add money</text>

    <!-- nav -->
    <g transform="translate(818 708)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">
      <text x="16" y="28" fill="#8FB5A7">Home</text>
      <text x="101" y="28" fill="#8FB5A7">Activity</text>
      <text x="186" y="28" fill="#8FB5A7">Budgets</text>
      <circle cx="271" cy="9" r="10" fill="#0E9F6E" opacity="0.16"/>
      <circle cx="271" cy="9" r="5" fill="none" stroke="#6FDDB5" stroke-width="1.6"/>
      <path d="M271 4v5l3 2" stroke="#6FDDB5" stroke-width="1.6" fill="none"/>
      <text x="271" y="28" fill="#6FDDB5" font-weight="600">Goals</text>
    </g>
  </g>

  <text x="700" y="802" text-anchor="middle" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5D756A">Design preview · implementation tracked milestone by milestone</text>
</svg>
