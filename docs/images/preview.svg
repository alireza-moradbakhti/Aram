      <text x="42" y="12" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#F3F8F5">Ride home</text>
      <text x="42" y="27" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="9.5" fill="#8FB5A7">Transport · Yesterday</text>
      <text x="272" y="18" text-anchor="end" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#F3F8F5">−$9.10</text>
    </g>

    <!-- bottom nav -->
    <rect x="316" y="702" width="316" height="28" fill="#0B1512"/>
    <g transform="translate(338 708)" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" text-anchor="middle">
      <circle cx="16" cy="8" r="10" fill="#0E9F6E" opacity="0.16"/>
      <path d="M11 10.5 16 6l5 4.5V15h-3.4v-3h-3.2v3H11Z" fill="#6FDDB5"/>
      <text x="16" y="28" fill="#6FDDB5" font-weight="600">Home</text>
      <path d="M96 6h10M96 10h10M96 14h6" stroke="#8FB5A7" stroke-width="1.6" stroke-linecap="round"/>
      <text x="101" y="28" fill="#8FB5A7">Activity</text>
      <path d="M181 6h10v9h-10z" stroke="#8FB5A7" stroke-width="1.4" fill="none"/>
      <path d="M183 12h6" stroke="#8FB5A7" stroke-width="1.4"/>
      <text x="186" y="28" fill="#8FB5A7">Budgets</text>
      <circle cx="271" cy="9" r="5" fill="none" stroke="#8FB5A7" stroke-width="1.6"/>
      <path d="M271 4v5l3 2" stroke="#8FB5A7" stroke-width="1.6" fill="none"/>
      <text x="271" y="28" fill="#8FB5A7">Goals</text>
    </g>
  </g>

  <!-- ================= PHONE B : GOALS ================= -->
  <g filter="url(#shadow)">
    <rect x="776" y="74" width="356" height="676" rx="60" fill="#0B1512" stroke="#233D34" stroke-width="2"/>
    <rect x="788" y="86" width="332" height="652" rx="48" fill="#0B1512"/>
  </g>
  <g clip-path="url(#screenB)">
    <rect x="796" y="94" width="316" height="636" fill="#0B1512"/>

    <text x="818" y="122" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#DCE5E0">9:41</text>
    <rect x="1066" y="111" width="20" height="10" rx="3" fill="#DCE5E0"/>
    <rect x="1048" y="113" width="14" height="8" rx="2" fill="#DCE5E0" opacity="0.55"/>

